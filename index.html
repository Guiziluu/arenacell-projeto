<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArenaCell | Catálogo de Peças</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    >

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <a class="pular-conteudo" href="#conteudo">Ir para a tabela</a>


    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <header class="topbar">

        <div class="marca-principal">
            <img
                src="AC.png"
                alt="Logo ArenaCell"
                class="logo"
                onerror="this.style.display='none'"
            >
            <div>
                <h1>ArenaCell</h1>
                <p>Catálogo de peças e valores</p>
            </div>
        </div>

        <div class="status-sync" id="statusSync" data-estado="conectando" role="status" aria-live="polite">
            <span class="status-ponto" aria-hidden="true"></span>
            <span class="status-texto">Conectando…</span>
        </div>

    </header>


    <div class="container">


        <!-- ======================================
             MENU LATERAL
        ======================================= -->

        <aside class="menu">

            <h2 class="menu-titulo">Marcas</h2>

            <nav class="menu-lista" aria-label="Marcas de celular">

                <button class="marca" data-marca="iphone" type="button">
                    <span class="marca-sigla" aria-hidden="true">iP</span>
                    <span class="marca-nome">iPhone</span>
                    <span class="marca-qtd"></span>
                </button>

                <button class="marca" data-marca="samsung" type="button">
                    <span class="marca-sigla" aria-hidden="true">Sa</span>
                    <span class="marca-nome">Samsung</span>
                    <span class="marca-qtd"></span>
                </button>

                <button class="marca" data-marca="motorola" type="button">
                    <span class="marca-sigla" aria-hidden="true">Mo</span>
                    <span class="marca-nome">Motorola</span>
                    <span class="marca-qtd"></span>
                </button>

                <button class="marca" data-marca="xiaomi" type="button">
                    <span class="marca-sigla" aria-hidden="true">Xi</span>
                    <span class="marca-nome">Xiaomi</span>
                    <span class="marca-qtd"></span>
                </button>

                <button class="marca" data-marca="realme" type="button">
                    <span class="marca-sigla" aria-hidden="true">Re</span>
                    <span class="marca-nome">Realme</span>
                    <span class="marca-qtd"></span>
                </button>

                <button class="marca" data-marca="infinix" type="button">
                    <span class="marca-sigla" aria-hidden="true">In</span>
                    <span class="marca-nome">Infinix</span>
                    <span class="marca-qtd"></span>
                </button>

                <button class="marca" data-marca="oppo" type="button">
                    <span class="marca-sigla" aria-hidden="true">Op</span>
                    <span class="marca-nome">OPPO</span>
                    <span class="marca-qtd"></span>
                </button>

            </nav>

        </aside>


        <!-- ======================================
             CONTEÚDO PRINCIPAL
        ======================================= -->

        <main>

            <section class="cabecalho-pagina">
                <h2 id="tituloMarca">Catálogo de peças</h2>
                <p id="descricaoPagina">Escolha uma marca para consultar os modelos e cadastrar os valores.</p>
                <p class="so-impressao" id="dataImpressao"></p>
            </section>


            <!-- Aparece depois que uma marca é aberta -->
            <div class="ferramentas" id="barraFerramentas" hidden>

                <label class="campo-pesquisa">
                    <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="8.5" cy="8.5" r="5.5"></circle>
                        <path d="M13 13l4 4"></path>
                    </svg>
                    <input
                        type="search"
                        id="pesquisa"
                        placeholder="Pesquisar modelo"
                        aria-label="Pesquisar modelo"
                        autocomplete="off"
                    >
                </label>

                <span class="contagem" id="contagem"></span>

                <span class="preenchimento" title="Preços já cadastrados nas peças exibidas">
                    <span class="preenchimento-barra"><i id="barraPreenchimento"></i></span>
                    <span id="textoPreenchimento"></span>
                </span>

                <div class="acoes">

                    <details class="colunas">
                        <summary>Peças exibidas</summary>
                        <div class="colunas-painel" id="seletorPecas"></div>
                    </details>

                    <button type="button" class="botao" id="botaoExportar" title="Baixar esta marca como planilha (Excel)">
                        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 3v10M6 9l4 4 4-4M4 16h12"></path>
                        </svg>
                        Exportar
                    </button>

                    <button type="button" class="botao" id="botaoImprimir" title="Imprimir só as linhas com preço">
                        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 7V3h8v4M6 14H4V8h12v6h-2M6 12h8v5H6z"></path>
                        </svg>
                        Imprimir
                    </button>

                </div>

            </div>


            <div id="conteudo">
                <div class="estado-vazio">
                    <h3>Nenhuma marca selecionada</h3>
                    <p>Escolha um fabricante no menu para ver os modelos e preencher o valor de cada peça.</p>
                </div>
            </div>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
